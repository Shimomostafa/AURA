<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./bootstrap/bootstrap-5.3.8-dist/css/bootstrap.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <main>
        <section>
            <div class="container">
                <div class="row text-center mt-3">
                    <span>AURA BEAUTY</span>
                    <h2>Complete Your Order!</h2>
                </div>
                <a class="text-decoration-none text-black" href="./index.html"><i class="fa-solid fa-arrow-left"></i> BACK TO HOME</a>
            </div>
        </section>
        <section>
            <div class="container">
                <div class="row">
                    <div class="col-md-6 order-last order-md-first">
                        <div class="checkout-card">
                            <h3>Customer Information</h3>
                            <form id="checkout-form">
                                <div class="d-flex flex-column">
                                    <label for="f-name">FULL NAME</label>
                                    <input id="f-name" type="text" placeholder="your full name" required>
                                </div>
                                <div class="d-flex flex-column">
                                    <label for="email">EMAIL ADDRESS</label>
                                    <input id="email" type="email" placeholder="your email" required>
                                </div>
                                <div class="d-flex flex-column">
                                    <label for="phone">PHONE NUMBER</label>
                                    <input id="phone" type="tel" placeholder="your phone number" required>
                                </div>
                                <div class="d-flex flex-column">
                                    <label for="address">ADDRESS</label>
                                    <input id="address" type="text" placeholder="your delivery address" required>
                                </div>
                                <button type="submit" class=" order-btn w-100 mt-3" >
                                    PLACE ORDER
                                </button>
                            </form>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="checkout-card p-4">
                            <h3>YOUR ORDER</h3>
                            <div class="order-items row gap-3"></div>
                            <div class=" order-total  justify-content-center mt-5"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="./checkout.js"></script>
</body>
</html>
